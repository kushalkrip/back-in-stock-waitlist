openapi: 3.0.0
info:
  title: Back-In-Stock Waitlist API
  description: >
    Accepts "notify me when back in stock" signups from the PDP and persists
    them as WaitlistSubscription custom objects. REGISTERED-USERS-ONLY: the
    subscriber email is derived server-side from the authenticated shopper's
    profile and is never accepted in the request body; a guest token is
    rejected with 401.
  # info.version drives the MAJOR version segment in the URL: v1
  version: 1.0.0
servers:
  - url: https://{shortCode}.api.commercecloud.salesforce.com/custom/waitlist/v1
    variables:
      shortCode:
        default: your-short-code
paths:
  # Path is RELATIVE to /organizations/{organizationId}, which the Custom API
  # platform auto-prepends. Declaring the org segment (or its path param) here
  # would double it and make every request untranslatable (404). The full URL is
  #   /custom/waitlist/v1/organizations/{organizationId}/subscriptions
  /subscriptions:
    get:
      summary: Whether the authenticated shopper is already on the waitlist for a SKU
      description: >
        Read-only status check used by the PDP on load. The subscriber email is
        derived from the token, so a shopper can only ever query their OWN
        status; a guest token yields subscribed:false rather than an error.
      operationId: getWaitlistStatus
      parameters:
        - name: siteId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: c_sku
          in: query
          required: true
          description: The selected VARIANT product ID to check.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Subscription status for this shopper + SKU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionStatusResponse'
        '400':
          description: Invalid input (invalid-sku)
      security:
        - ShopperToken: [c_waitlist_rw]
    post:
      summary: Join the back-in-stock waitlist for a SKU
      operationId: joinWaitlist
      parameters:
        - name: siteId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRequest'
      responses:
        '200':
          description: Subscription created or already existed (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
        '400':
          description: Invalid input (invalid-json / invalid-sku)
        '401':
          description: Not a registered, authenticated shopper (guest-not-allowed / no-account-email)
        '500':
          description: Persistence error
      security:
        - ShopperToken: [c_waitlist_rw]
components:
  securitySchemes:
    ShopperToken:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://j1jska9w.api.commercecloud.salesforce.com/shopper/auth/v1/organizations/f_ecom_zzft_025/oauth2/authorize
          tokenUrl: https://j1jska9w.api.commercecloud.salesforce.com/shopper/auth/v1/organizations/f_ecom_zzft_025/oauth2/token
          scopes:
            c_waitlist_rw: Manage back-in-stock waitlist subscriptions
  schemas:
    SubscriptionRequest:
      type: object
      required:
        - sku
      properties:
        sku:
          type: string
          description: The selected VARIANT product ID (not the master).
        locale:
          type: string
          example: en_US
      # NOTE: there is intentionally NO `email` property. The subscriber email
      # is resolved server-side from the authenticated shopper's profile.
    SubscriptionResponse:
      type: object
      properties:
        status:
          type: string
          enum: [subscribed, already-subscribed]
        sku:
          type: string
    SubscriptionStatusResponse:
      type: object
      properties:
        subscribed:
          type: boolean
          description: True if this shopper already has a subscription for the SKU.
        sku:
          type: string
